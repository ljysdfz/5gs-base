logger:
    file: /open5gs/install/var/log/open5gs/smf.log

parameter:
    no_ipv4v6_local_addr_in_packet_filter: true

smf:
#    freeDiameter: /open5gs/install/etc/freeDiameter/smf.conf
    sbi:
      - addr: #SMF_SBI_IP#
        port: 7777
    gtpc:
      - addr: #SMF_SBI_IP#
    gtpu:
      - addr: #SMF_N4_IP#
    pfcp:
      - addr: #SMF_N4_IP#
    subnet:
      - addr: 192.168.100.1/24
        dnn: internet
        dev: ogstun
      - addr: 192.168.101.1/24
        dnn: ims
        dev: ogstun2
    dns:
      - 114.114.114.114
#    p-cscf:
#      - #PCSCF_IP#
    mtu: 1400

nrf:
    sbi:
      - addr:
          - #NRF_IP#
        port: 7777

upf:
    pfcp:
      - addr: #UPF_N4_IP#
